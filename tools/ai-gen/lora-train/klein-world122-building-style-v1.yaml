---
job: extension
config:
  name: "klein-world122-building-style-v1"
  process:
    - type: "sd_trainer"
      training_folder: "D:/开发文件/lora-train/output"
      device: cuda:0
      trigger_word: "wuxianlunhui world122 building style"
      network:
        type: "lora"
        linear: 32
        linear_alpha: 16
      save:
        dtype: float16
        save_every: 100
        max_step_saves_to_keep: 5
        push_to_hub: false
      datasets:
        - folder_path: "D:/开发文件/lora-train/dataset-world122-building"
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [1024, 1024]
      train:
        batch_size: 1
        steps: 500
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        lr: 1e-4
        ema_config:
          use_ema: true
          ema_decay: 0.99
        dtype: bf16
      model:
        name_or_path: "D:/开发文件/lora-train/base/flux-2-klein-base-4b.safetensors"
        arch: "flux2_klein_4b"
        te_dtype: "fp16"
        quantize: true
        qtype: "qfloat8"
        quantize_te: false
        model_kwargs:
          flux2_klein_te_path: "D:/开发文件/lora-train/te/Qwen3-4B"
          flux2_vae_path: "D:/开发文件/ComfyUI/models/vae/flux2-vae.safetensors"
      sample:
        sampler: "flowmatch"
        sample_every: 100
        sample_start_step: 100
        width: 1024
        height: 1024
        prompts:
          - "wuxianlunhui world122 building style, a compact fortified stone chapel, dark brown timber framing, muted brick-red roof tiles, warm windows, orthographic dimetric strategy-game building, transparent-background-ready isolated object"
          - "wuxianlunhui world122 building style, a compact research workshop with a square tower, dark timber and stone, aged brick-red roof, warm windows, orthographic dimetric strategy-game building, transparent-background-ready isolated object"
