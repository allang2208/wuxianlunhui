<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <filter id="technology-tv-noise" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
    <feComponentTransfer in="mono">
      <feFuncR type="linear" slope="2.4" intercept="-0.7"/>
      <feFuncG type="linear" slope="2.4" intercept="-0.7"/>
      <feFuncB type="linear" slope="2.4" intercept="-0.7"/>
      <feFuncA type="identity"/>
    </feComponentTransfer>
  </filter>
  <rect width="96" height="96" fill="#000"/>
  <rect width="96" height="96" filter="url(#technology-tv-noise)"/>
</svg>
