            <div id="devToolPanel" class="dev-tool-panel">
                <div class="dev-tool-header">
                    <span class="dev-tool-title">🛠️ 交互开发工具</span>
                    <button class="dev-tool-close" id="devToolClose">✕</button>
                </div>
                <!-- Tab 栏 -->
                <div class="dev-tool-tabs">
                    <div class="dev-tool-tab active" data-tab="weapon" onclick="DevTool.switchTab('weapon')">武器</div>
                </div>
                <!-- Tab 内容：武器 -->
                <div class="dev-tool-tab-content active" data-tab-content="weapon">
                <!-- 上方菜单栏 -->
                <div class="dev-tool-menu">
                    <div class="dev-tool-menu-item">
                        <label>动画:</label>
                        <select id="devToolAnimSelect">
                            <option value="idle">待机</option>
                            <option value="walk">移动</option>
                            <option value="running">奔跑</option>
                            <option value="attack">攻击</option>
                            <option value="bow_draw">拉弓</option>
                            <option value="bow_release">射箭</option>
                            <option value="gun_idle">持枪待机</option>
                            <option value="gun_fire">射击</option>
                            <option value="reload">换弹</option>
                            <option value="hurt">受击</option>
                            <option value="death">死亡</option>
                        </select>
                    </div>
                    <div class="dev-tool-menu-item">
                        <label>帧:</label>
                        <input type="range" id="devToolFrameSlider" min="0" max="0" value="0">
                        <span id="devToolFrameLabel">1 / 1</span>
                        <button id="devToolPlayBtn" class="dev-tool-menu-btn">▶ 播放</button>
                        <input type="number" id="devToolFps" min="1" max="60" step="1" style="width:48px" title="播放帧率（留空=动画配置帧率）" placeholder="fps">
                    </div>
                    <div class="dev-tool-menu-item">
                        <label>武器:</label>
                        <select id="devToolWeaponSelect">
                            <option value="sword">⚔️ 剑（生锈长剑）</option>
                            <option value="bow">🏹 弓（训练弓）</option>
                            <option value="pistol">🔫 手枪（G18）</option>
                            <option value="deagle">🔫 沙漠之鹰</option>
                            <option value="pkm">🔥 PKM</option>
                            <option value="akm">🔥 AKM</option>
                            <option value="qbz191">🔥 QBZ-191</option>
                            <option value="qjb201">🔥 QJB-201</option>
                            <option value="super90">🔫 Super90</option>
                            <option value="saiga12k">🔫 S12K</option>
                            <option value="energy_lmg">🔫 能量轻机枪</option>
                        </select>
                    </div>
                    <button class="dev-tool-menu-btn" id="devToolSave">💾 保存</button>
                    <button class="dev-tool-menu-btn" id="devToolReset2">🔄 重置</button>
                    <button class="dev-tool-menu-btn" id="devToolCoord">📐 坐标工具</button>
                </div>
                <!-- 下方双栏 -->
                <div class="dev-tool-content">
                    <!-- 左栏：人物动画展示 -->
                    <div class="dev-tool-left">
                        <div class="dev-tool-canvas-wrap">
                            <canvas id="devToolCanvas" width="640" height="520"></canvas>
                            <div class="dev-tool-canvas-overlay">
                                <div class="dev-tool-hint-text" id="devToolHint">
                                    拖动武器到人物位置 → 按 <kbd>R</kbd> 进入调整模式
                                </div>
                            </div>
                        </div>
                        <div class="dev-tool-info" id="devToolInfo">
                            <div class="dev-tool-info-row">
                                <span>状态:</span> <span id="devToolStatus">待机</span>
                            </div>
                            <div class="dev-tool-info-row">
                                <span>武器:</span> <span id="devToolWeaponName">无</span>
                            </div>
                        </div>
                    </div>
                    <!-- 右栏：武器选择和控制 -->
                    <div class="dev-tool-right">
                        <div class="dev-tool-section-title">武器贴图</div>
                        <div class="dev-tool-weapon-preview" id="devToolWeaponPreview">
                            <div class="dev-tool-weapon-placeholder">选择武器类型</div>
                            <img id="devToolWeaponImg" src="" style="display:none; cursor: var(--bp-cursor-grab, grab);" alt="weapon" draggable="true">
                        </div>
                        <div class="dev-tool-controls">
                            <div class="dev-tool-control-row">
                                <label>屏幕偏移X:</label>
                                <input type="number" id="devToolOffX" value="0" step="1">
                            </div>
                            <div class="dev-tool-control-row">
                                <label>屏幕偏移Y:</label>
                                <input type="number" id="devToolOffY" value="0" step="1">
                            </div>
                            <div class="dev-tool-control-row">
                                <label>Rotation:</label>
                                <input type="number" id="devToolRot" value="0" step="1">
                            </div>
                            <div class="dev-tool-control-row">
                                <label>Scale:</label>
                                <input type="number" id="devToolScl" value="1" step="0.1">
                            </div>
                            <div class="dev-tool-control-row">
                                <button id="devToolMarker" class="dev-tool-menu-btn" style="width:100%" title="在武器贴图上放置校准标记点，所有帧同步显示">📍 固定点</button>
                            </div>
                        </div>
                        <div class="dev-tool-mode-hint" id="devToolModeHint">
                            <div>🖱 左键拖动</div>
                            <div>🔄 滚轮缩放</div>
                            <div>按 <kbd>R</kbd> 切换旋转/缩放模式</div>
                        </div>
                        <div class="dev-tool-data-output" id="devToolDataOutput" style="display:none;"></div>
                    </div>
                </div>
                </div>
            </div>
